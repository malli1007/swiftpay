spring.application.name=transaction-gateway-service

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/swiftpay
spring.datasource.username=swiftpay
spring.datasource.password=swiftpay
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

ledger.service.base-url=http://localhost:8082

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.kafka.bootstrap-servers=http://localhost:9092

################# actuator ##############################

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized

# App info
info.app.name=transaction-gateway-service
info.app.version=1.0.0
info.app.description=Spring Boot Microservice

